<!DOCTYPE html>
<html lang="id" class="is-loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../">
  <title>Daftar Pesanan | Rayden Viz</title>
  <meta name="description" content="Pantau status pesanan yang sedang diproses oleh Rayden Viz.">
  <meta name="theme-color" content="#151515">
  <link rel="icon" href="assets/img/logo/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/pages/pesanan.css">
</head>
<body data-page="pesanan">

  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <canvas class="dot-field" aria-hidden="true"></canvas>
      <div class="container">
        <p class="eyebrow" data-reveal>Daftar Pesanan</p>
        <h1 data-split>Pantau progres <em class="text-gold">karya Anda.</em></h1>
        <p class="lead" data-reveal style="--d:250ms">Cari kode pesanan Anda untuk melihat status terkini. Nama klien disamarkan untuk menjaga privasi.</p>
      </div>
    </section>

    <section class="section-tight orders-section">
      <div class="container">
        <!-- Ringkasan jumlah per status -->
        <div class="order-stats" id="orderStats"></div>

        <!-- Pencarian dan filter -->
        <div class="order-toolbar" data-reveal>
          <label class="search-box">
            <span class="sr-only">Cari pesanan</span>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input class="input" type="search" id="orderSearch" placeholder="Cari kode, layanan, atau nama">
          </label>
          <div class="chips" id="orderFilter"></div>
        </div>

        <!-- Daftar pesanan diisi oleh pesanan.js -->
        <div class="order-list" id="orderList"></div>

        <p class="order-updated" data-reveal>Data diperbarui manual. Terakhir diperbarui <span id="orderUpdated"></span>.</p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data/list-layanan/desain-grafis.js"></script>
  <script src="assets/js/data/list-layanan/photo-editing.js"></script>
  <script src="assets/js/data/list-layanan/web-design.js"></script>
  <script src="assets/js/data/list-layanan/app-design.js"></script>
  <script src="assets/js/data/list-layanan/roblox.js"></script>
  <script src="assets/js/data/list-layanan/model-3d.js"></script>
  <script src="assets/js/data/list-layanan/polaroid.js"></script>
  <script src="assets/js/data/list-layanan/stiker.js"></script>
  <script src="assets/js/data/layanan.js"></script>
  <script src="assets/js/data/status-pesanan.js"></script>
  <script src="assets/js/data/list-status/antre.js"></script>
  <script src="assets/js/data/list-status/ditunda.js"></script>
  <script src="assets/js/data/list-status/proses.js"></script>
  <script src="assets/js/data/list-status/revisi.js"></script>
  <script src="assets/js/data/list-status/selesai.js"></script>
  <script src="assets/js/data/index.js"></script>
  <script src="assets/js/core/icons.js"></script>
  <script src="assets/js/core/utils.js"></script>
  <script src="assets/js/core/layout.js"></script>
  <script src="assets/js/core/animations.js"></script>
  <script src="assets/js/core/scene.js"></script>
  <script src="assets/js/pages/pesanan.js"></script>
  <script src="assets/js/core/boot.js"></script>
</body>
</html>
